services:
    backend:
        build:
            context: ./backend
            target: production
        environment:
            CHROMA_PATH: /app/data/chroma
            COLLECTION_NAME: company_docs
            OPENAI_API_KEY: ${OPENAI_API_KEY:-}
        volumes:
            - chroma-data:/app/data/chroma
        expose:
            - '8000'
        healthcheck:
            test:
                [
                    'CMD',
                    'python',
                    '-c',
                    "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 20s
        restart: unless-stopped

    frontend:
        build:
            context: ./frontend
            target: production
        expose:
            - '80'
        depends_on:
            backend:
                condition: service_healthy
        restart: unless-stopped

    nginx:
        image: nginx:1.27-alpine
        ports:
            - '8080:80'
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - backend
            - frontend
        restart: unless-stopped

    # One-off test runner (CI simulation)
    backend-test:
        build:
            context: ./backend
            target: test
        profiles: ['test']

volumes:
    chroma-data:
