# Production compose — pulls pre-built images from GHCR.
# Copy this file + nginx/nginx.conf + .env to your Linux VM.

services:
  backend:
    image: ghcr.io/mabedd/company-docs-rag-backend:${IMAGE_TAG:-latest}
    environment:
      CHROMA_PATH: /app/data/chroma
      COLLECTION_NAME: company_docs
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - chroma-data:/app/data/chroma
    expose:
      - '8000'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    image: ghcr.io/mabedd/company-docs-rag-frontend:${IMAGE_TAG:-latest}
    expose:
      - '80'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  chroma-data:
